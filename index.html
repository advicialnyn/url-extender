<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUBJECT INTAKE — Do Not Close This Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#040404;
    --panel:#0b0b0b;
    --blood:#7a0d0d;
    --blood-bright:#e2261c;
    --sick:#3f4d33;
    --text:#c7c7c2;
    --dim:#6b6b66;
    --line:#232323;
    --accent:#e2261c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 14px 60px;
    line-height:1.5;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    z-index:1;
    animation:scan 9s linear infinite;
  }
  body::after{
    content:"";
    position:fixed; inset:0;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
    pointer-events:none;
    z-index:1;
  }
  @keyframes scan{ 0%{background-position:0 0;} 100%{background-position:0 300px;} }

  #app{width:100%;max-width:560px;position:relative;z-index:2;}

  .sheet{
    background:var(--panel);
    border:1px solid var(--blood);
    box-shadow:0 0 24px rgba(226,38,28,0.15), inset 0 0 40px rgba(0,0,0,0.6);
    position:relative;
  }
  .letterhead{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
    text-align:center;
  }
  .eye{
    font-size:22px;
    display:block;
    margin-bottom:8px;
    animation:blink 4.5s ease-in-out infinite;
    filter:drop-shadow(0 0 6px rgba(226,38,28,0.6));
  }
  @keyframes blink{ 0%,92%,100%{opacity:1; transform:scaleY(1);} 95%{opacity:0.3; transform:scaleY(0.1);} }
  .bureau{
    font-size:10.5px;
    letter-spacing:2px;
    color:var(--dim);
    margin:0 0 10px;
    text-transform:uppercase;
  }
  h1{
    font-family:'Creepster', cursive;
    font-weight:400;
    font-size:30px;
    letter-spacing:1px;
    margin:0 0 8px;
    color:var(--blood-bright);
    text-shadow:0 0 10px rgba(226,38,28,0.5), 2px 0 var(--sick);
    animation:flicker 6s infinite;
  }
  @keyframes flicker{
    0%,3%,6%,100%{ opacity:1; }
    4%{ opacity:0.4; }
    5%{ opacity:0.85; }
  }
  .subtitle{
    font-size:11.5px;
    color:var(--dim);
    margin:0;
  }
  .section{
    padding:18px 20px;
    border-bottom:1px solid var(--line);
  }
  .section:last-child{border-bottom:none;}
  label.field-label{
    display:block;
    font-size:11px;
    font-weight:600;
    letter-spacing:1px;
    color:var(--blood-bright);
    margin-bottom:8px;
    text-transform:uppercase;
  }
  input[type=text], input[type=number]{
    width:100%;
    font-family:inherit;
    font-size:14px;
    padding:10px 10px;
    background:#000;
    border:1px solid var(--line);
    color:var(--text);
  }
  input[type=text]:focus, input[type=number]:focus{
    outline:1.5px solid var(--blood-bright);
    outline-offset:1px;
    border-color:var(--blood-bright);
  }
  .procedure{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .procedure:last-child{border-bottom:none;}
  .procedure input[type=radio]{
    appearance:none;
    -webkit-appearance:none;
    width:18px;height:18px;
    min-width:18px;
    border:1px solid var(--dim);
    background:#000;
    margin-top:2px;
    display:grid;
    place-content:center;
    cursor:pointer;
  }
  .procedure input[type=radio]::before{
    content:"";
    width:10px;height:10px;
    transform:scale(0);
    background:var(--blood-bright);
    box-shadow:0 0 6px var(--blood-bright);
  }
  .procedure input[type=radio]:checked::before{transform:scale(1);}
  .code{
    font-weight:700;
    color:var(--blood-bright);
    margin-right:4px;
  }
  .proc-name{font-weight:600;font-size:13.5px;color:var(--text);}
  .proc-desc{font-size:11.5px;color:var(--dim);margin-top:3px;}
  .sub-options{
    margin:10px 0 0 28px;
    padding:10px;
    border:1px dashed var(--line);
    background:rgba(226,38,28,0.03);
    display:none;
  }
  .sub-options.active{display:block;}
  .sub-options label{font-size:11px;color:var(--dim);display:block;margin-bottom:4px;letter-spacing:0.5px;}
  button{
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    letter-spacing:1.5px;
    padding:13px 16px;
    background:var(--blood);
    color:#efe3e3;
    border:1px solid var(--blood-bright);
    cursor:pointer;
    width:100%;
    text-transform:uppercase;
    box-shadow:0 0 14px rgba(226,38,28,0.25);
  }
  button:active{transform:translateY(1px);}
  button.secondary{
    background:transparent;
    color:var(--text);
    border:1px solid var(--line);
    width:auto;
    padding:8px 12px;
    font-size:11.5px;
    margin-top:8px;
    box-shadow:none;
  }
  .error-box{
    border:1px solid var(--blood-bright);
    color:var(--blood-bright);
    font-size:12px;
    font-weight:600;
    padding:8px 10px;
    margin-bottom:10px;
    display:none;
  }
  .result{ display:none; }
  .result.active{display:block;}
  textarea{
    width:100%;
    font-family:inherit;
    font-size:12px;
    padding:10px;
    border:1px solid var(--line);
    background:#000;
    color:var(--text);
    resize:vertical;
    min-height:90px;
    word-break:break-all;
  }
  .stats{
    font-size:11.5px;
    color:var(--dim);
    margin-top:8px;
    line-height:1.6;
  }
  .stats b{color:var(--blood-bright);}
  footer{
    text-align:center;
    font-size:10.5px;
    color:#3a3a3a;
    margin-top:16px;
    padding:0 10px;
    letter-spacing:0.5px;
  }

  /* ---------- Processing view: full-screen takeover ---------- */
  #processView{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    z-index:50;
    overflow:hidden;
  }
  #processView[hidden]{ display:none; }
  #processView::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 3px);
    animation:scan 4s linear infinite;
  }
  #processView::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(ellipse at center, rgba(122,13,13,0.12) 0%, transparent 60%);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:0.6;} 50%{opacity:1;} }
  #processView.crash{ animation:powerFlicker 0.25s steps(3,end) infinite; }
  @keyframes powerFlicker{
    0%,100%{ background:#000; }
    50%{ background:#0d0000; }
  }
  #procVisual{ min-height:50px; margin-bottom:10px; }
  #procVisual .eye{
    font-size:34px;
    display:inline-block;
    position:relative; z-index:2;
    filter:drop-shadow(0 0 14px var(--accent));
    animation:blink 3.2s ease-in-out infinite;
  }
  .spiral-visual{
    width:64px;height:64px;
    margin:0 auto;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent), transparent 35%, var(--accent) 75%, transparent);
    filter:drop-shadow(0 0 10px var(--accent));
    animation:spiralSpin 1.1s linear infinite;
  }
  @keyframes spiralSpin{ to{ transform:rotate(360deg); } }
  #processView.theme-static::before{
    opacity:0.85;
    animation-duration:0.25s;
  }
  #processView .code-line{
    font-size:11px;
    letter-spacing:2px;
    color:var(--dim);
    margin-bottom:16px;
    text-transform:uppercase;
    position:relative; z-index:2;
  }
  #processView .msg{
    font-family:'Creepster', cursive;
    font-size:26px;
    letter-spacing:0.5px;
    color:var(--accent);
    min-height:60px;
    margin-bottom:24px;
    position:relative; z-index:2;
    text-shadow:0 0 12px var(--accent);
  }
  .bar-track{
    width:100%;
    max-width:320px;
    height:6px;
    border:1px solid var(--line);
    background:#000;
    overflow:hidden;
    margin-bottom:12px;
    position:relative; z-index:2;
  }
  .bar-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width 0.5s ease;
    box-shadow:0 0 8px var(--accent);
  }
  .hop-count{font-size:11px;color:var(--dim);letter-spacing:2px;position:relative;z-index:2;}

  #processView.glitching{
    animation: glitchShake 0.45s linear;
  }
  @keyframes glitchShake{
    0%,100%{ transform:translate(0,0); filter:none; }
    8%{ transform:translate(-6px,3px) skewX(2deg); filter:hue-rotate(40deg) contrast(1.4); }
    16%{ transform:translate(6px,-3px) skewX(-2deg); filter:hue-rotate(-40deg); }
    24%{ transform:translate(-5px,-5px); }
    32%{ transform:translate(5px,5px); filter:invert(0.15); }
    40%{ transform:translate(-3px,3px); }
    48%{ transform:translate(4px,-4px) skewY(1deg); filter:hue-rotate(25deg); }
    56%{ transform:translate(-4px,2px); }
    64%{ transform:translate(4px,-2px); }
    72%{ transform:translate(-2px,2px); }
    80%{ transform:translate(2px,-2px); filter:contrast(1.6); }
    90%{ transform:translate(-1px,1px); }
  }
  #processView.glitching .msg, #processView.glitching .code-line{
    animation: glitchText 0.45s steps(2, end);
  }
  @keyframes glitchText{
    0%{ text-shadow:3px 0 var(--accent), -3px 0 var(--sick); opacity:0.8; }
    25%{ text-shadow:-3px 0 var(--accent), 3px 0 var(--sick); opacity:0.5; }
    50%{ text-shadow:3px 3px var(--accent), -3px -3px var(--sick); opacity:0.9; }
    75%{ text-shadow:-2px 2px var(--accent), 2px -2px var(--sick); opacity:0.6; }
    100%{ text-shadow:0 0 12px var(--accent); opacity:1; }
  }
</style>
</head>
<body>
<div id="app">

  <div id="formView">
    <div class="sheet">
      <div class="letterhead">
        <span class="eye">&#128065;</span>
        <p class="bureau">Intake Office &mdash; No One Leaves the Same</p>
        <h1>SUBJECT INTAKE FORM</h1>
        <p class="subtitle">Submit a link. It will not arrive the way you sent it.</p>
      </div>

      <div class="section">
        <label class="field-label" for="targetUrl">01 &mdash; Destination (attach in full)</label>
        <input type="text" id="targetUrl" placeholder="https://example.com/page">
      </div>

      <div class="section">
        <label class="field-label">02 &mdash; Choose what happens to them</label>

        <label class="procedure">
          <input type="radio" name="mode" value="troll" checked>
          <span>
            <span><span class="code">04</span><span class="proc-name">The Relay</span></span>
            <div class="proc-desc">A short, fake tracking trail and one whispered warning before delivery.</div>
          </span>
        </label>

        <label class="procedure">
          <input type="radio" name="mode" value="desc">
          <span>
            <span><span class="code">11</span><span class="proc-name">The Whisper</span></span>
            <div class="proc-desc">The link grows a long, unsettling description of where it leads.</div>
          </span>
        </label>

        <label class="procedure">
          <input type="radio" name="mode" value="chain">
          <span>
            <span><span class="code">22</span><span class="proc-name">The Chain</span></span>
            <div class="proc-desc">They pass through several dark rooms before the door finally opens.</div>
          </span>
          <div class="sub-options" id="chainOpts">
            <label for="hopCount">ROOMS TO PASS THROUGH (2&ndash;12)</label>
            <input type="number" id="hopCount" min="2" max="12" value="6">
          </div>
        </label>

        <label class="procedure">
          <input type="radio" name="mode" value="max">
          <span>
            <span><span class="code">99</span><span class="proc-name">The Weight</span></span>
            <div class="proc-desc">The link is made as heavy as it can possibly be.</div>
          </span>
          <div class="sub-options" id="maxOpts">
            <label for="junkLen">PAYLOAD SIZE IN CHARACTERS (200&ndash;3000)</label>
            <input type="number" id="junkLen" min="200" max="3000" value="1500">
          </div>
        </label>
      </div>

      <div class="section">
        <label class="field-label">03 &mdash; How long should they stay</label>
        <label for="hopDelay" style="display:block;font-size:11px;color:var(--dim);margin-bottom:4px;">PAUSE PER ROOM, IN MILLISECONDS (500&ndash;4000)</label>
        <input type="number" id="hopDelay" min="500" max="4000" step="100" value="1200" style="margin-bottom:14px;">
        <label class="procedure" style="border-bottom:none;padding-top:0;">
          <input type="checkbox" id="useHistory" checked style="appearance:auto;width:16px;height:16px;margin-top:3px;">
          <span>
            <span class="proc-name">Leave a trail they can walk back through</span>
            <div class="proc-desc">Each room becomes its own page — pressing back steps through them one by one.</div>
          </span>
        </label>
      </div>

      <div class="section">
        <div class="error-box" id="errorBox"></div>
        <button id="submitBtn" type="button">Begin Intake</button>

        <div class="result" id="resultBox">
          <label class="field-label" style="margin-top:16px;">Result &mdash; Link Prepared</label>
          <textarea id="resultText" readonly></textarea>
          <button class="secondary" id="copyBtn" type="button">Copy Link</button>
          <div class="stats" id="statsBox"></div>
        </div>
      </div>
    </div>
    <footer>It will feel longer than it is. That is the point.</footer>
  </div>

  <div id="processView" hidden>
    <div id="procVisual"><span class="eye">&#128065;</span></div>
    <div class="code-line" id="procCode">PROCESSING...</div>
    <div class="msg" id="procMsg">wait.</div>
    <div class="bar-track"><div class="bar-fill" id="procBar"></div></div>
    <div class="hop-count" id="procHopCount"></div>
    <a href="#" id="escapeHatch" style="display:none;color:var(--dim);font-size:10.5px;margin-top:22px;text-decoration:underline;position:relative;z-index:2;">stuck? start over</a>
  </div>

</div>

<script>
(function(){

  function base() { return location.origin + location.pathname; }

  function b64e(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64d(str){ return decodeURIComponent(escape(atob(str))); }
  function safeB64d(str){
    try { return b64d(str); } catch(e){ return null; }
  }

  function fallbackToForm(){
    try { history.replaceState(null, '', base()); } catch(e){}
    var pv = document.getElementById('processView');
    pv.hidden = true;
    pv.classList.remove('glitching','crash');
    document.getElementById('formView').hidden = false;
    initForm();
  }

  function normalizeUrl(u){
    u = u.trim();
    if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }

  function randomHex(len){
    var chars = 'abcdef0123456789';
    var out = '';
    for(var i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }

  function randomJunk(len){
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    var out = '';
    for(var i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }

  var slugPrefixes = ['you-shouldnt-have-clicked','it-was-waiting-for-you','do-not-look-away-from','presenting-against-your-will'];
  var slugAdjectives = ['forbidden','ancient','watching','unnecessarily-long','already-known','deeply-questionable'];
  var slugSubjects = ['account-of','warning-about','record-of','last-known-sighting-of'];
  var slugTopics = ['what-follows-you-home','the-thing-in-the-hallway','why-the-lights-flicker','a-door-that-should-stay-shut','the-quest-for-brevity'];

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function buildDescriptiveSlug(){
    return pick(slugPrefixes) + '/' + pick(slugAdjectives) + '-' + pick(slugSubjects) + '/' + pick(slugTopics);
  }

  var trollMessages = [
    'it sees you',
    'still there?',
    'do not blink',
    'almost inside',
    'it knows this link',
    'someone is typing...',
    'don\u2019t look behind you'
  ];

  var chainMessages = [
    'room 1 was empty. this one isn\u2019t',
    'something followed you in',
    'the door is locked now',
    'it\u2019s closer than last room',
    'keep walking',
    'you are not alone here',
    'the walls are breathing',
    'it remembers you'
  ];

  // ---------- FORM VIEW ----------
  function initForm(){
    var radios = document.querySelectorAll('input[name=mode]');
    function syncSubOptions(){
      document.getElementById('chainOpts').classList.toggle('active', getMode()==='chain');
      document.getElementById('maxOpts').classList.toggle('active', getMode()==='max');
    }
    function getMode(){
      var checked = document.querySelector('input[name=mode]:checked');
      return checked ? checked.value : 'troll';
    }
    radios.forEach(function(r){ r.addEventListener('change', syncSubOptions); });
    syncSubOptions();

    document.getElementById('submitBtn').addEventListener('click', function(){
      var errorBox = document.getElementById('errorBox');
      var resultBox = document.getElementById('resultBox');
      errorBox.style.display = 'none';
      resultBox.classList.remove('active');

      var raw = document.getElementById('targetUrl').value;
      if(!raw.trim()){
        errorBox.textContent = 'REJECTED \u2014 A DESTINATION IS REQUIRED';
        errorBox.style.display = 'block';
        return;
      }
      var target = normalizeUrl(raw);
      var mode = getMode();
      var hopDelay = parseInt(document.getElementById('hopDelay').value, 10) || 1200;
      hopDelay = Math.max(500, Math.min(4000, hopDelay));
      var useHistory = document.getElementById('useHistory').checked ? 1 : 0;
      var params = new URLSearchParams();
      params.set('mode', mode);
      params.set('t', b64e(target));
      params.set('delay', hopDelay);
      params.set('hist', useHistory);
      var hashSuffix = '';

      if(mode === 'troll'){
        params.set('utm_source', 'definitely_not_spam');
        params.set('utm_medium', 'trust_me_bro');
        params.set('ref', 'friend_recommendation');
        params.set('fbclid', randomHex(16));
        params.set('session', randomHex(24));
        params.set('hops', 4);
        params.set('total', 4);
      } else if(mode === 'desc'){
        hashSuffix = '#/' + buildDescriptiveSlug();
        params.set('hops', 2);
        params.set('total', 2);
      } else if(mode === 'chain'){
        var hops = parseInt(document.getElementById('hopCount').value, 10) || 6;
        hops = Math.max(2, Math.min(12, hops));
        params.set('hops', hops);
        params.set('total', hops);
      } else if(mode === 'max'){
        var len = parseInt(document.getElementById('junkLen').value, 10) || 1500;
        len = Math.max(200, Math.min(3000, len));
        params.set('junk', randomJunk(len));
        params.set('hops', 2);
        params.set('total', 2);
      }

      var finalUrl = base() + '?' + params.toString() + hashSuffix;
      document.getElementById('resultText').value = finalUrl;

      var pct = Math.round(((finalUrl.length - target.length) / target.length) * 100);
      document.getElementById('statsBox').innerHTML =
        'ORIGINAL LENGTH: <b>' + target.length + ' chars</b><br>' +
        'EXTENDED LENGTH: <b>' + finalUrl.length + ' chars</b><br>' +
        'INCREASE: <b>+' + pct + '%</b>';

      resultBox.classList.add('active');
    });

    document.getElementById('copyBtn').addEventListener('click', function(){
      var text = document.getElementById('resultText').value;
      var btn = this;
      function done(){ btn.textContent = 'COPIED'; setTimeout(function(){btn.textContent='Copy Link';}, 1500); }
      if(navigator.clipboard){
        navigator.clipboard.writeText(text).then(done).catch(function(){
          document.getElementById('resultText').select();
          document.execCommand('copy');
          done();
        });
      } else {
        document.getElementById('resultText').select();
        document.execCommand('copy');
        done();
      }
    });
  }

  var visualThemes = [
    { id:'eye',    accent:'#e2261c', icon:'&#128065;' },  // red, watching eye
    { id:'skull',  accent:'#39ff14', icon:'&#128128;' },  // toxic green, skull
    { id:'hand',   accent:'#9b30ff', icon:'&#128400;' },  // violet, reaching hand
    { id:'spiral', accent:'#ff6a00', icon:null },          // amber, hypnotic spiral
    { id:'static', accent:'#eaeaea', icon:null }           // white, pure noise
  ];

  function applyVisualTheme(processView){
    processView.classList.remove('theme-eye','theme-skull','theme-hand','theme-spiral','theme-static');
    var theme = pick(visualThemes);
    processView.classList.add('theme-' + theme.id);
    processView.style.setProperty('--accent', theme.accent);
    var visual = document.getElementById('procVisual');
    if(theme.id === 'spiral'){
      visual.innerHTML = '<div class="spiral-visual"></div>';
    } else if(theme.id === 'static'){
      visual.innerHTML = '';
    } else {
      visual.innerHTML = '<span class="eye">' + theme.icon + '</span>';
    }
  }

  // ---------- PROCESSING VIEW ----------
  var modeInfo = {
    troll: { label: 'SUBJECT 04 \u2014 THE RELAY', messages: trollMessages, delay: 900 },
    desc:  { label: 'SUBJECT 11 \u2014 THE WHISPER', messages: ['it\u2019s already known', 'no turning back', 'the path is written'], delay: 800 },
    chain: { label: 'SUBJECT 22 \u2014 THE CHAIN', messages: chainMessages, delay: 1000 },
    max:   { label: 'SUBJECT 99 \u2014 THE WEIGHT', messages: ['it grows heavier', 'carrying more than you know', 'almost too much to hold'], delay: 800 }
  };

  function initProcessing(params){
    document.getElementById('formView').hidden = true;
    var processView = document.getElementById('processView');
    processView.hidden = false;
    processView.classList.remove('glitching');
    void processView.offsetWidth; // restart animation on repeated hops
    processView.classList.add('glitching');
    setTimeout(function(){ processView.classList.remove('glitching'); }, 460);
    applyVisualTheme(processView);

    var escapeHatch = document.getElementById('escapeHatch');
    escapeHatch.style.display = 'none';
    escapeHatch.onclick = function(e){ e.preventDefault(); fallbackToForm(); };
    var escapeTimer = setTimeout(function(){ escapeHatch.style.display = 'inline-block'; }, 6000);

    var mode = params.get('mode');
    var target = safeB64d(params.get('t'));
    if(!target || !/^https?:\/\//i.test(target)){
      clearTimeout(escapeTimer);
      fallbackToForm();
      return;
    }
    var info = modeInfo[mode] || modeInfo.troll;

    var hops = parseInt(params.get('hops'), 10);
    var total = parseInt(params.get('total'), 10);
    if(isNaN(hops) || hops < 1) hops = 1;
    if(isNaN(total) || total < 1) total = hops;

    var delay = parseInt(params.get('delay'), 10);
    if(isNaN(delay) || delay < 200) delay = info.delay;
    var useHistory = params.get('hist') === '1';

    var msgEl = document.getElementById('procMsg');
    var codeEl = document.getElementById('procCode');
    var barEl = document.getElementById('procBar');
    var hopEl = document.getElementById('procHopCount');

    codeEl.textContent = info.label;
    msgEl.textContent = pick(info.messages);
    hopEl.textContent = 'ROOM ' + (total - hops + 1) + ' OF ' + total;
    var pct = Math.round(((total - hops) / total) * 100);
    barEl.style.width = pct + '%';

    // final room: brief power-flicker crash effect before delivery
    if(hops <= 1){
      processView.classList.add('crash');
    }

    function goTo(url){
      if(useHistory){ location.href = url; }
      else { location.replace(url); }
    }

    setTimeout(function(){
      clearTimeout(escapeTimer);
      try {
        if(hops <= 1){
          goTo(target);
          return;
        }
        var next = new URLSearchParams();
        next.set('mode', mode);
        next.set('t', b64e(target));
        next.set('hops', hops - 1);
        next.set('total', total);
        next.set('delay', delay);
        next.set('hist', useHistory ? 1 : 0);
        goTo(base() + '?' + next.toString());
      } catch(e){
        fallbackToForm();
      }
    }, delay);
  }

  // ---------- ENTRY ----------
  var params = new URLSearchParams(location.search);
  if(params.get('mode') && params.get('t')){
    try { initProcessing(params); }
    catch(e){ fallbackToForm(); }
  } else {
    initForm();
  }

})();
</script>
</body>
</html>
